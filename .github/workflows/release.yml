name: Release

# Versioning and publishing are separate steps:
# - push to main: keeps the "chore: version packages" PR up to date (no publishing);
# - manual run (Actions → Release → Run workflow): publishes the current versions to npm.
# GitHub releases (vX.Y.Z) are created when a version is merged; see CONTRIBUTING.md.
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  version:
    name: Version Packages PR
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # version branch
      pull-requests: write # "Version Packages" PR
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v4.4.0 (version from packageManager)

      - name: Setup Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Same health gate as CI: never publish from a red main.
      - name: Run Full Health Gate
        run: pnpm validate

      # No `publish` input: with pending changesets this opens/updates the version PR;
      # without changesets it does nothing.
      - name: Create or update the Version Packages PR
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version: pnpm version-packages
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish to npm (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Protected environment: configure required reviewers in Settings → Environments → npm.
    environment: npm
    permissions:
      contents: read
      id-token: write # npm provenance / Trusted Publishing (OIDC)
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v4.4.0 (version from packageManager)

      - name: Setup Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Same health gate as CI: never publish from a red main.
      - name: Run Full Health Gate
        run: pnpm validate

      - name: Publish
        run: pnpm changeset publish --no-git-tag
        env:
          # Bootstrap only: once npm Trusted Publishing is configured for both packages,
          # delete this secret — OIDC (id-token above) then authenticates the publish.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
