    <style>
      body {
        min-block-size: 100vh;
        background: var(--ms-color-surface-default);
        color: var(--ms-color-text-primary);
        font-family: var(--ms-font-sans);
      }
      .topbar {
        display: flex;
        align-items: center;
        gap: var(--ms-space-4);
        padding-inline: var(--ms-space-4);
        block-size: var(--ms-layout-topbar-height);
        background: var(--ms-color-surface-inverse);
        color: var(--ms-color-text-inverse);
        position: sticky;
        inset-block-start: 0;
        z-index: var(--ms-z-index-sticky);
      }
      .logo {
        font-family: var(--ms-font-display);
        font-weight: var(--ms-typography-weight-bold);
        font-size: var(--ms-typography-size-lg);
        letter-spacing: -0.01em;
        color: var(--ms-color-text-inverse);
      }
      .logo span {
        color: var(--ms-color-interactive-primary);
      }
      .nav {
        display: flex;
        gap: var(--ms-space-1);
      }
      .nav a {
        padding: var(--ms-space-1) var(--ms-space-3);
        border-radius: var(--ms-radius-md);
        color: color-mix(in oklch, var(--ms-color-text-inverse) 70%, transparent);
        text-decoration: none;
        font-size: var(--ms-typography-size-sm);
        font-weight: var(--ms-typography-weight-medium);
      }
      .nav a.is-active {
        background-color: var(--ms-color-interactive-accent);
        color: var(--ms-color-text-on-accent);
      }
      .icon-moon {
        display: none;
      }
      html[data-ms-color-mode="dark"] .icon-sun {
        display: none;
      }
      html[data-ms-color-mode="dark"] .icon-moon {
        display: block;
      }
      .main {
        display: grid;
        gap: var(--ms-space-5);
        padding: var(--ms-space-5);
        max-inline-size: 1280px;
        margin-inline: auto;
      }
      .panel {
        border: var(--ms-border-hairline) solid var(--ms-color-border-subtle);
        border-radius: var(--ms-radius-lg);
        background-color: var(--ms-color-surface-raised);
        padding: var(--ms-space-5);
        display: grid;
        gap: var(--ms-space-4);
      }
      h1 {
        font-size: var(--ms-typography-size-3xl);
        letter-spacing: var(--ms-typography-letter-spacing-tight);
        font-family: var(--ms-font-display);
      }
      h2 {
        font-size: var(--ms-typography-size-lg);
        letter-spacing: var(--ms-typography-letter-spacing-tight);
      }
      .matrix {
        display: grid;
        grid-template-columns: auto repeat(8, max-content);
        gap: var(--ms-space-3);
        align-items: center;
      }
      .row-label {
        font-family: var(--ms-font-mono);
        font-size: var(--ms-typography-size-2xs);
        letter-spacing: var(--ms-typography-letter-spacing-micro);
        text-transform: uppercase;
        color: var(--ms-color-text-muted);
        min-inline-size: 64px;
      }
      .flex {
        display: flex;
        flex-wrap: wrap;
        gap: var(--ms-space-3);
        align-items: center;
      }
      .section-title {
        font-family: var(--ms-font-mono);
        font-size: var(--ms-typography-size-xs);
        letter-spacing: var(--ms-typography-letter-spacing-micro);
        text-transform: uppercase;
        color: var(--ms-color-text-muted);
      }
    </style>

              data-variant="outline"
              data-tone="primary"
              data-size="md"
            >
              Month
            </button>
          </div>
          <div class="ms-button-group" role="group">
            <button
              class="ms-button"
              data-ms-button
              data-variant="solid"
              data-tone="primary"
              data-size="md"
            >
              B
            </button>
            <button
              class="ms-button"
              data-ms-button
              data-variant="solid"
              data-tone="primary"
              data-size="md"
            >
              I
            </button>
            <button
              class="ms-button"
              data-ms-button
              data-variant="solid"
              data-tone="primary"
              data-size="md"
            >
              U
            </button>
          </div>
          <div class="ms-button-group" role="group">
            <button
              class="ms-button"
              data-ms-button
              data-variant="outline"
              data-tone="primary"
              data-size="md"
              data-pill
            >
              ← Prev
            </button>
            <button
              class="ms-button"
              data-ms-button
              data-variant="outline"
              data-tone="primary"
              data-size="md"
              data-pill
            >
              Next →
            </button>
          </div>
        </div>
      </section>

      <section class="panel">
        <span class="section-title">States</span>
        <div class="flex">
          <button
            class="ms-button"
            data-ms-button
            data-variant="solid"
            data-tone="primary"
            data-size="md"
            disabled
          >
            Disabled
          </button>
          <button
            class="ms-button"
            data-ms-button
            data-variant="solid"
            data-tone="primary"
            data-size="md"
            data-loading
            aria-busy="true"
          >
            <span class="ms-button-label">Loading</span
            ><span class="ms-button-spinner" aria-hidden="true"></span>
          </button>
          <button
            class="ms-button"
            data-ms-button
            data-variant="gradient"
            data-tone="primary"
            data-size="md"
            data-loading
            aria-busy="true"
          >
            <span class="ms-button-label">Loading gradient</span
            ><span class="ms-button-spinner" aria-hidden="true"></span>
          </button>
          <button
            class="ms-button"
            data-ms-button
            data-variant="solid"
            data-tone="primary"
            data-size="md"
            id="focus-demo"
          >
            Tab to focus
          </button>
        </div>
      </section>

      <section class="panel">
        <span class="section-title">Dropdown (static open state)</span>
        <div class="flex">
          <div class="ms-dropdown">
            <button
              class="ms-button"
              data-ms-button
              data-variant="outline"
              data-tone="primary"
              data-size="md"
              aria-haspopup="menu"
              aria-expanded="true"
              data-open
            >
              <span class="ms-button-label">Actions</span>
              <span class="ms-button-caret" aria-hidden="true"
                ><svg
                  width="14"
                  height="14"
                  viewBox="0 0 16 16"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.5"
                >
                  <path d="M4 6l4 4 4-4" /></svg
              ></span>
            </button>
            <div class="ms-menu" role="menu" tabindex="-1">
              <div class="ms-menu-item" role="menuitem" data-active>Edit</div>
              <div class="ms-menu-item" role="menuitem">
                Duplicate <span class="ms-button-suffix">⌘D</span>
              </div>
              <div class="ms-menu-item" role="menuitem" data-selected>Rename</div>
              <div class="ms-menu-item" role="menuitem" data-disabled>Archive</div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script src="/theme-toggle.js"></script>
  </body>
</html>
